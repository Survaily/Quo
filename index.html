<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quo - Picture Transformer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Quo</h1>
      <p class="tagline">Transform your picture into something unexpected</p>
    </header>

    <div class="upload-area" id="uploadArea">
      <input type="file" id="fileInput" accept="image/*" hidden>
      <div class="upload-prompt" id="uploadPrompt">
        <div class="upload-icon">&#128247;</div>
        <p>Drop an image here or <span class="browse-link">browse</span></p>
      </div>
      <img id="preview" class="preview-image" hidden>
    </div>

    <button id="transformBtn" class="transform-btn" disabled>
      <span class="btn-text">Transform</span>
      <span class="btn-icon">&#9889;</span>
    </button>

    <div id="resultSection" class="result-section" hidden>
      <div class="result-label" id="resultLabel"></div>
      <canvas id="outputCanvas"></canvas>
      <button id="downloadBtn" class="download-btn">Download Result</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
